<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ግቢ ጉባኤ ትስስር · Campus Connect — ፍኖተ ጥበብ ሰ.ት.ቤት</title>
<meta name="description" content="Fanote Tibeb Sunday School Campus Connect — keeping university students connected to their Sunday School community.">

<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campus Connect">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="fw-root" id="fw-root">

  <div class="fw-header">
    <div class="fw-headrow">
      <img class="fw-emblem" alt="Finote Tibeb Sunday School emblem" src="icons/logo.png">
      <div class="fw-titles">
        <p class="fw-eyebrow" data-am="ኮዬ ፋንታ ደብረ ፀሐይ · ፍኖተ ጥበብ ሰ.ት.ቤት" data-en="Koye Feche Debre Tsehay · Finote Tibeb SS">ኮዬ ፋንታ ደብረ ፀሐይ · ፍኖተ ጥበብ ሰ.ት.ቤት</p>
        <h1 class="fw-title" data-am="ግቢ ጉባኤ ትስስር" data-en="Campus Connect">ግቢ ጉባኤ ትስስር</h1>
      </div>
      <button class="fw-langbtn" id="fw-notif-btn" title="Reminders" style="margin-right:6px;">🔔</button>
      <button class="fw-langbtn" id="fw-lang-toggle">EN</button>
    </div>
    <div class="fw-userline">
      <span id="fw-userline-text" data-am="እንኳን ደህና መጣችሁ" data-en="Welcome">እንኳን ደህና መጣችሁ</span>
      <button id="fw-edit-profile" data-am="መገለጫዬን አርትዕ" data-en="Edit my info">መገለጫዬን አርትዕ</button>
    </div>
    <div id="fw-offline-banner" class="fw-offline-banner fw-hidden"></div>
  </div>

  <div class="fw-tabs" id="fw-tabs">
    <div class="fw-tab active" data-tab="feed">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span data-am="ዜና" data-en="Feed">ዜና</span>
    </div>
    <div class="fw-tab" data-tab="events">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span data-am="መርሐ ግብር" data-en="Events">መርሐ ግብር</span>
    </div>
    <div class="fw-tab" data-tab="spiritual">
      <svg viewBox="0 0 24 24"><path d="M12 4v16M6 9h12"/></svg>
      <span data-am="መንፈሳዊ ሕይወት" data-en="Spiritual">መንፈሳዊ ሕይወት</span>
    </div>
    <div class="fw-tab" data-tab="group">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><path d="M3 19c.5-3 2.5-4.5 5-4.5s4.5 1.5 5 4.5M11 19c.5-3 2.5-4.5 5-4.5s4.5 1.5 5 4.5"/></svg>
      <span data-am="ንዑስ ቤተሰብ" data-en="My Group">ንዑስ ቤተሰብ</span>
    </div>
    <div class="fw-tab" data-tab="directory">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-4 3.8-6 7-6s6 2 7 6"/></svg>
      <span data-am="አድራሻ" data-en="Directory">አድራሻ</span>
    </div>
  </div>

  <div class="fw-main" id="fw-main">
    <div class="fw-loading" data-am="እየጫነ ነው…" data-en="Loading…">እየጫነ ነው…</div>
  </div>

  <div class="fw-toast" id="fw-toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="config.js" defer></script>
<script src="auth.js" defer></script>
<script src="db.js" defer></script>
<script src="idb-reminders.js" defer></script>
<script src="notifications.js" defer></script>
<script src="app.js" defer></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
